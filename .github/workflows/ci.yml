name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify (Postgres + Redis + MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Os testes de integração rodam contra infraestrutura real, a mesma do desenvolvimento:
      # sobe só os serviços de apoio do compose e espera os healthchecks passarem.
      - name: Sobe Postgres, Redis e MinIO
        run: docker compose up -d --wait db redis minio

      - name: Build e testes
        run: ./mvnw -B -ntp verify

      - name: Logs dos serviços (em caso de falha)
        if: failure()
        run: docker compose logs db redis minio

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
