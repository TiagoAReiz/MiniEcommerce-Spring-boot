spring.application.name=MiniEcommerce
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost:5432}/test-flyway?createDatabaseIfNotExist=true
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
#spring.jpa.generate-ddl=true
#spring.jpa.hibernate.ddl-auto=create


spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-pool-size=3
spring.datasource.hikari.maximum-idle-timeout=10000