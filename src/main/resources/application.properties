spring.application.name=MiniEcommerce
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost:5432}/postgres
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
#spring.jpa.generate-ddl=true
#spring.jpa.hibernate.ddl-auto=create


spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-pool-size=3
spring.datasource.hikari.maximum-idle-timeout=10000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.auth.google-issuer=${GOOGLE_ISSUER:https://accounts.google.com}
app.auth.google-client-id=${GOOGLE_CLIENT_ID:}
app.auth.issuer=${JWT_ISSUER:miniecommerce}
app.auth.token-ttl=${JWT_TOKEN_TTL:1h}
app.auth.secret=${JWT_SECRET:change-me-please-use-at-least-32-bytes-long}

app.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
app.storage.public-url=${STORAGE_PUBLIC_URL:http://localhost:9000}
app.storage.region=${STORAGE_REGION:us-east-1}
app.storage.bucket=${STORAGE_BUCKET:product-photos}
app.storage.access-key=${STORAGE_ACCESS_KEY:minioadmin}
app.storage.secret-key=${STORAGE_SECRET_KEY:minioadmin}
app.storage.path-style-access=${STORAGE_PATH_STYLE_ACCESS:true}
app.storage.max-file-size=${STORAGE_MAX_FILE_SIZE:5242880}
app.storage.allowed-content-types=${STORAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}

spring.servlet.multipart.max-file-size=${STORAGE_MAX_FILE_SIZE:5242880}
spring.servlet.multipart.max-request-size=${STORAGE_MAX_REQUEST_SIZE:6291456}

app.mercado-pago.base-url=${MP_BASE_URL:https://api.mercadopago.com}
app.mercado-pago.access-token=${MP_ACCESS_TOKEN:}
app.mercado-pago.webhook-secret=${MP_WEBHOOK_SECRET:}
app.mercado-pago.notification-url=${MP_NOTIFICATION_URL:}
app.mercado-pago.success-url=${MP_SUCCESS_URL:http://localhost:3000/orders}
app.mercado-pago.failure-url=${MP_FAILURE_URL:http://localhost:3000/orders}
app.mercado-pago.pending-url=${MP_PENDING_URL:http://localhost:3000/orders}
app.mercado-pago.notification-memory=${MP_NOTIFICATION_MEMORY:24h}
app.mercado-pago.timeout=${MP_TIMEOUT:10s}
app.mercado-pago.reconciliation-interval=${MP_RECONCILIATION_INTERVAL:5m}
app.mercado-pago.reconciliation-min-age=${MP_RECONCILIATION_MIN_AGE:5m}
app.mercado-pago.reconciliation-max-age=${MP_RECONCILIATION_MAX_AGE:24h}
app.mercado-pago.reconciliation-batch-size=${MP_RECONCILIATION_BATCH_SIZE:50}

# Behind nginx and ngrok the client is two hops away: without this Spring reports the
# proxy as the caller and builds Location headers pointing at http://localhost:8081
# instead of the public https URL the browser actually used.
server.forward-headers-strategy=framework

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.cors.max-age=${CORS_MAX_AGE:1h}
